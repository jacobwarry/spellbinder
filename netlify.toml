[build]
  publish = "dist"
  command = "npm run build"

# Proxy Archidekt API server-side to avoid browser CORS (must come BEFORE the SPA catch-all)
[[redirects]]
  from = "/api/archidekt/*"
  to = "https://archidekt.com/api/:splat"
  status = 200
  force = true

# Redirect all requests to index.html for Vue Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
